<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evaluador DGT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    header {
      background: #17324d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    main {
      max-width: 620px;
      margin: 20px auto;
      padding: 0 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
      box-shadow: 0 5px 16px rgba(0,0,0,0.08);
    }

    h2, h3 {
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 17px;
      margin-bottom: 14px;
    }

    button {
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    .primary {
      width: 100%;
      padding: 15px;
      background: #17324d;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .primary:active {
      transform: scale(0.99);
    }

    .student-label {
      font-size: 13px;
      color: #64748b;
    }

    .student-name {
      font-size: 22px;
      font-weight: 800;
    }

    #timer {
      text-align: center;
      font-size: 34px;
      font-weight: 800;
      margin-top: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .category {
      background: #173b5d;
      color: white;
      min-height: 70px;
      padding: 10px 6px;
      font-weight: 700;
      font-size: 14px;
    }

    .category span {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .back {
      background: #e5e7eb;
      color: #1f2937;
      padding: 10px 14px;
      font-weight: 700;
      margin-bottom: 15px;
    }

    .fault-button {
      width: 100%;
      text-align: left;
      padding: 14px;
      margin-bottom: 9px;
      background: #f1f5f9;
      color: #1f2937;
      border: 1px solid #e2e8f0;
      font-size: 14px;
    }

    .fault-button strong {
      display: block;
      margin-bottom: 3px;
    }

    .fault-button small {
      color: #64748b;
    }

    .counters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .counter {
      background: #f3f4f6;
      text-align: center;
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 12px;
    }

    .counter strong {
      display: block;
      font-size: 22px;
    }

    #result {
      margin-top: 10px;
      padding: 11px;
      border-radius: 9px;
      text-align: center;
      font-weight: 800;
    }

    .apto {
      background: #d1fae5;
      color: #166534;
    }

    .no-apto {
      background: #fee2e2;
      color: #991b1b;
    }

    .incident {
      padding: 10px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      min-width: 26px;
      padding: 3px 7px;
      border-radius: 6px;
      color: white;
      text-align: center;
      font-weight: 800;
      margin-right: 6px;
    }

    .badge-E {
      background: #c81e1e;
    }

    .badge-D {
      background: #e67e00;
    }

    .badge-L {
      background: #2563eb;
    }

    .hidden {
      display: none !important;
    }

    .empty {
      color: #64748b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 8px 0 30px;
    }

    @media (max-width: 430px) {
      header {
        padding: 16px 10px;
      }

      header h1 {
        font-size: 22px;
      }

      main {
        margin-top: 14px;
        padding: 0 10px;
      }

      .card {
        padding: 15px;
      }

      .category {
        min-height: 66px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🚗 Evaluador DGT</h1>
  <p>Evaluación de clases prácticas de conducción</p>
</header>

<main>

  <!-- PANTALLA INICIAL -->
  <section id="startScreen" class="card">
    <h2>Nueva evaluación</h2>

    <label for="studentInput">Alumno</label>

    <input
      id="studentInput"
      type="text"
      placeholder="Nombre del alumno"
      autocomplete="off"
    >

    <button class="primary" onclick="startClass()">
      Iniciar clase
    </button>
  </section>


  <!-- EVALUACIÓN -->
  <div id="evaluationScreen" class="hidden">

    <section class="card">
      <div class="student-label">Alumno</div>
      <div id="studentName" class="student-name"></div>
      <div id="timer">00:00</div>
    </section>


    <!-- MENÚ PRINCIPAL -->
    <section id="categoryScreen" class="card">

      <h2>¿Qué ha ocurrido?</h2>

      <div class="grid">

        <button class="category" onclick="openCategory('incorporacion')">
          <span>🚘</span>
          Incorporación
        </button>

        <button class="category" onclick="openCategory('circulacion')">
          <span>🛣️</span>
          Circulación / carril
        </button>

        <button class="category" onclick="openCategory('interseccion')">
          <span>➕</span>
          Intersección
        </button>

        <button class="category" onclick="openCategory('glorieta')">
          <span>🔄</span>
          Glorieta
        </button>

        <button class="category" onclick="openCategory('velocidad')">
          <span>⏱️</span>
          Velocidad
        </button>

        <button class="category" onclick="openCategory('peatones')">
          <span>🚶</span>
          Peatones
        </button>

        <button class="category" onclick="openCategory('intermitentes')">
          <span>↔️</span>
          Intermitentes
        </button>

        <button class="category" onclick="openCategory('senales')">
          <span>🛑</span>
          Señales
        </button>

        <button class="category" onclick="openCategory('estacionamiento')">
          <span>🅿️</span>
          Estacionamiento
        </button>

        <button class="category" onclick="openCategory('mandos')">
          <span>⚙️</span>
          Mandos
        </button>

      </div>
    </section>


    <!-- SUBMENÚ DE FALTAS -->
    <section id="faultScreen" class="card hidden">

      <button class="back" onclick="backToCategories()">
        ← Volver
      </button>

      <h2 id="categoryTitle"></h2>

      <div id="faultOptions"></div>

    </section>


    <!-- CONTADORES -->
    <section class="card">

      <div class="counters">

        <div class="counter">
          Eliminatorias
          <strong id="countE">0</strong>
        </div>

        <div class="counter">
          Deficientes
          <strong id="countD">0</strong>
        </div>

        <div class="counter">
          Leves
          <strong id="countL">0</strong>
        </div>

      </div>

      <div id="result" class="apto">
        APTO
      </div>

    </section>


    <!-- INCIDENCIAS -->
    <section class="card">

      <h3>Incidencias registradas</h3>

      <div id="incidentList">
        <div class="empty">Sin incidencias registradas.</div>
      </div>

    </section>


    <section class="card">
      <button class="primary" onclick="finishEvaluation()">
        Finalizar evaluación
      </button>
    </section>

  </div>

</main>


<footer>
  Evaluador DGT · Versión 0.5
</footer>

function startClass() {

  const input = document.getElementById("studentInput");
  const name = input.value.trim();

  if (!name) {
    alert("Introduce el nombre del alumno.");
    input.focus();
    return;
  }

  document.getElementById("studentName").textContent = name;

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("evaluationScreen").classList.remove("hidden");

  seconds = 0;

  document.getElementById("timer").textContent = "00:00";

  timerInterval = setInterval(() => {

    seconds++;

    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;

    document.getElementById("timer").textContent =
      String(minutes).padStart(2, "0") +
      ":" +
      String(secs).padStart(2, "0");

  }, 1000);

}


function openCategory(categoryKey) {

  const category = categories[categoryKey];

  document.getElementById("categoryScreen").classList.add("hidden");
  document.getElementById("faultScreen").classList.remove("hidden");

  document.getElementById("categoryTitle").textContent = category.title;

  const container = document.getElementById("faultOptions");

  container.innerHTML = "";

  category.faults.forEach(fault => {

    const button = document.createElement("button");

    button.className = "fault-button";

    button.innerHTML =
      "<strong>" + fault.text + "</strong>" +
      "<small>Criterio " + fault.code + "</small>";

    button.onclick = function() {
      registerIncident(
        category.title,
        fault.text,
        fault.code,
        fault.type
      );
    };

    container.appendChild(button);

  });

}


function backToCategories() {

  document.getElementById("faultScreen").classList.add("hidden");
  document.getElementById("categoryScreen").classList.remove("hidden");

}


function registerIncident(category, text, code, type) {

  if (type === "E") {
    eliminatorias++;
  }

  if (type === "D") {
    deficientes++;
  }

  if (type === "L") {
    leves++;
  }

  incidents.push({
    category,
    text,
    code,
    type,
    time: document.getElementById("timer").textContent
  });

  updateEvaluation();

  backToCategories();

}


function updateEvaluation() {

  document.getElementById("countE").textContent = eliminatorias;
  document.getElementById("countD").textContent = deficientes;
  document.getElementById("countL").textContent = leves;

  const result = document.getElementById("result");

  /*
    BAREMO DGT

    1 Eliminatoria
    2 Deficientes
    1 Deficiente + 5 Leves
    10 Leves
  */

  const noApto =
    eliminatorias >= 1 ||
    deficientes >= 2 ||
    (deficientes >= 1 && leves >= 5) ||
    leves >= 10;

  if (noApto) {

    result.textContent = "NO APTO";
    result.className = "no-apto";

  } else {

    result.textContent = "APTO";
    result.className = "apto";

  }

  renderIncidents();

}


function renderIncidents() {

  const container = document.getElementById("incidentList");

  if (incidents.length === 0) {

    container.innerHTML =
      '<div class="empty">Sin incidencias registradas.</div>';

    return;
  }

  container.innerHTML = "";

  incidents.forEach((incident, index) => {

    const div = document.createElement("div");

    div.className = "incident";

    div.innerHTML =
      '<span class="badge badge-' +
      incident.type +
      '">' +
      incident.type +
      "</span>" +
      "<strong>" +
      incident.time +
      "</strong> · " +
      incident.text +
      "<br><small>" +
      incident.category +
      " · " +
      incident.code +
      "</small>";

    container.appendChild(div);

  });

}


function finishEvaluation() {

  clearInterval(timerInterval);

  const name =
    document.getElementById("studentName").textContent;

  const time =
    document.getElementById("timer").textContent;

  const result =
    document.getElementById("result").textContent;

  alert(
    "Evaluación finalizada\n\n" +
    "Alumno: " + name + "\n" +
    "Duración: " + time + "\n\n" +
    "Eliminatorias: " + eliminatorias + "\n" +
    "Deficientes: " + deficientes + "\n" +
    "Leves: " + leves + "\n\n" +
    "Resultado: " + result
  );

}


/*
  IMPORTANTE:
  No se inicia ningún temporizador al cargar la página.
  Solamente startClass() puede ponerlo en marcha.
*/
