<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluador DGT</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

header {
  background: #17324d;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 6px 0 0;
  opacity: .85;
}

main {
  max-width: 760px;
  margin: 25px auto;
  padding: 0 16px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

h2, h3 {
  margin-top: 0;
}

label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 16px;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #17324d;
  color: white;
  margin-top: 16px;
}

.hidden {
  display: none;
}

.alumno {
  font-size: 24px;
  font-weight: 700;
}

.timer {
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  margin: 15px 0;
}

.botones-faltas {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.falta {
  min-height: 85px;
  color: white;
}

.eliminatoria {
  background: #b91c1c;
}

.deficiente {
  background: #d97706;
}

.leve {
  background: #2563eb;
}

.falta span {
  display: block;
  font-size: 13px;
  font-weight: 500;
  margin-top: 4px;
}

.contadores {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin-top: 16px;
}

.contador {
  background: #f3f4f6;
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}

.contador strong {
  display: block;
  font-size: 25px;
}

.resultado {
  text-align: center;
  padding: 15px;
  border-radius: 12px;
  font-size: 20px;
  font-weight: 800;
  margin-top: 16px;
}

.apto {
  background: #dcfce7;
  color: #166534;
}

.no-apto {
  background: #fee2e2;
  color: #991b1b;
}

#historial {
  padding-left: 20px;
}

#historial li {
  margin-bottom: 8px;
}

.finalizar {
  width: 100%;
  background: #111827;
  color: white;
}

.version {
  text-align: center;
  color: #6b7280;
  font-size: 13px;
  margin: 25px;
}

@media(max-width: 520px) {
  .botones-faltas {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚗 Evaluador DGT</h1>
  <p>Evaluación de clases prácticas de conducción</p>
</header>

<main>

<section id="inicio">

  <div class="card">
    <h2>Nueva evaluación</h2>

    <label for="alumno">Alumno</label>
    <input
      type="text"
      id="alumno"
      placeholder="Nombre del alumno"
    >

    <button class="primary" onclick="iniciarEvaluacion()">
      Iniciar evaluación
    </button>
  </div>

</section>


<section id="evaluacion" class="hidden">

  <div class="card">

    <div>Alumno</div>
    <div id="nombreAlumno" class="alumno"></div>

    <div class="timer" id="cronometro">
      00:00
    </div>

  </div>


  <div class="card">

    <h2>Registrar incidencia</h2>

    <div class="botones-faltas">

      <button
        class="falta eliminatoria"
        onclick="registrarFalta('E')">
        ELIMINATORIA
        <span>Falta E</span>
      </button>

      <button
        class="falta deficiente"
        onclick="registrarFalta('D')">
        DEFICIENTE
        <span>Falta D</span>
      </button>

      <button
        class="falta leve"
        onclick="registrarFalta('L')">
        LEVE
        <span>Falta L</span>
      </button>

    </div>


    <div class="contadores">

      <div class="contador">
        Eliminatorias
        <strong id="contadorE">0</strong>
      </div>

      <div class="contador">
        Deficientes
        <strong id="contadorD">0</strong>
      </div>

      <div class="contador">
        Leves
        <strong id="contadorL">0</strong>
      </div>

    </div>

    <div id="resultado" class="resultado apto">
      APTO
    </div>

  </div>


  <div class="card">

    <h3>Incidencias registradas</h3>

    <ul id="historial">
      <li id="sinIncidencias">
        Sin incidencias registradas.
      </li>
    </ul>

  </div>


  <div class="card">

    <button
      class="finalizar"
      onclick="finalizarEvaluacion()">
      Finalizar evaluación
    </button>

  </div>

</section>

<p class="version">
  Evaluador DGT · Versión 0.2
</p>

</main>


<script>

let segundos = 0;
let intervalo;

let faltas = {
  E: 0,
  D: 0,
  L: 0
};


function iniciarEvaluacion() {

  const alumno =
    document.getElementById("alumno").value.trim();

  if (!alumno) {
    alert("Introduce el nombre del alumno.");
    return;
  }

  document.getElementById("nombreAlumno").textContent =
    alumno;

  document.getElementById("inicio")
    .classList.add("hidden");

  document.getElementById("evaluacion")
    .classList.remove("hidden");

  intervalo = setInterval(actualizarCronometro, 1000);

}


function actualizarCronometro() {

  segundos++;

  const minutos =
    Math.floor(segundos / 60)
      .toString()
      .padStart(2,"0");

  const seg =
    (segundos % 60)
      .toString()
      .padStart(2,"0");

  document.getElementById("cronometro")
    .textContent = minutos + ":" + seg;

}


function registrarFalta(tipo) {

  faltas[tipo]++;

  actualizarContadores();

  const sinIncidencias =
    document.getElementById("sinIncidencias");

  if (sinIncidencias) {
    sinIncidencias.remove();
  }

  const hora =
    document.getElementById("cronometro").textContent;

  const nombres = {
    E: "Eliminatoria",
    D: "Deficiente",
    L: "Leve"
  };

  const li = document.createElement("li");

  li.textContent =
    hora + " — " + nombres[tipo];

  document.getElementById("historial")
    .appendChild(li);

  calcularResultado();

}


function actualizarContadores() {

  document.getElementById("contadorE")
    .textContent = faltas.E;

  document.getElementById("contadorD")
    .textContent = faltas.D;

  document.getElementById("contadorL")
    .textContent = faltas.L;

}


function calcularResultado() {

  let noApto = false;

  if (faltas.E >= 1) {
    noApto = true;
  }

  if (faltas.D >= 2) {
    noApto = true;
  }

  if (faltas.D >= 1 && faltas.L >= 5) {
    noApto = true;
  }

  if (faltas.L >= 10) {
    noApto = true;
  }

  const resultado =
    document.getElementById("resultado");

  if (noApto) {

    resultado.textContent = "NO APTO";

    resultado.classList.remove("apto");
    resultado.classList.add("no-apto");

  } else {

    resultado.textContent = "APTO";

    resultado.classList.remove("no-apto");
    resultado.classList.add("apto");

  }

}


function finalizarEvaluacion() {

  clearInterval(intervalo);

  const alumno =
    document.getElementById("nombreAlumno").textContent;

  const tiempo =
    document.getElementById("cronometro").textContent;

  const resultado =
    document.getElementById("resultado").textContent;

  alert(
    "Evaluación finalizada\n\n" +
    "Alumno: " + alumno + "\n" +
    "Tiempo: " + tiempo + "\n\n" +
    "Eliminatorias: " + faltas.E + "\n" +
    "Deficientes: " + faltas.D + "\n" +
    "Leves: " + faltas.L + "\n\n" +
    "Resultado: " + resultado
  );

}

</script>

</body>
</html>
