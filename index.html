<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluador DGT</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f6f8;
  color:#1f2937;
}

header{
  background:#173b5b;
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  font-size:14px;
}

main{
  max-width:520px;
  margin:15px auto;
  padding:0 12px 30px;
}

.card{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.student{
  font-size:13px;
}

.student strong{
  display:block;
  font-size:17px;
}

.timer{
  text-align:center;
  font-size:30px;
  font-weight:700;
  margin-top:8px;
}

h2{
  font-size:20px;
  margin:0 0 12px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

button{
  border:0;
  border-radius:9px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
}

.category{
  min-height:58px;
  padding:10px;
  background:#173b5b;
  color:white;
}

.category span{
  display:block;
  font-size:18px;
  margin-bottom:4px;
}

.back{
  background:#e5e7eb;
  color:#1f2937;
  padding:9px 12px;
  margin-bottom:12px;
}

.incident{
  display:block;
  width:100%;
  text-align:left;
  background:#f3f4f6;
  color:#1f2937;
  padding:13px;
  margin:7px 0;
  border:1px solid #e5e7eb;
}

.incident:hover{
  background:#e9eef4;
}

.section-title{
  font-size:14px;
  font-weight:700;
  color:#173b5b;
  margin:15px 0 7px;
}

.counters{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.counter{
  background:#f3f4f6;
  border-radius:9px;
  padding:9px;
  text-align:center;
  font-size:12px;
}

.counter strong{
  display:block;
  font-size:19px;
}

.result{
  margin-top:10px;
  padding:9px;
  text-align:center;
  border-radius:8px;
  font-weight:800;
}

.apto{
  background:#d1fae5;
  color:#166534;
}

.no-apto{
  background:#fee2e2;
  color:#991b1b;
}

.log-item{
  border-bottom:1px solid #e5e7eb;
  padding:9px 0;
  font-size:13px;
}

.log-item:last-child{
  border-bottom:0;
}

.badge{
  display:inline-block;
  min-width:25px;
  text-align:center;
  padding:3px 6px;
  border-radius:5px;
  color:white;
  font-weight:700;
  margin-right:5px;
}

.badge.E{background:#c81e1e}
.badge.D{background:#df7a00}
.badge.L{background:#2563eb}

.code{
  font-weight:700;
  color:#173b5b;
}

.finish{
  width:100%;
  padding:13px;
  background:#173b5b;
  color:white;
}

.hidden{display:none}

footer{
  text-align:center;
  font-size:11px;
  color:#6b7280;
  margin-top:18px;
}

.note{
  font-size:12px;
  color:#6b7280;
  margin-top:10px;
}
</style>
</head>

<body>

<header>
  <h1>🚗 Evaluador DGT</h1>
  <p>Evaluación de clases prácticas de conducción</p>
</header>

<main>

<div class="card">
  <div class="student">
    Alumno
    <strong id="studentName">Alumno</strong>
  </div>
  <div class="timer" id="timer">00:00</div>
</div>

<div class="card" id="categoriesCard">
  <h2>¿Qué ha ocurrido?</h2>

  <div class="grid">
    <button class="category" onclick="openCategory('incorporacion')">
      <span>🚘</span>Incorporación
    </button>

    <button class="category" onclick="openCategory('circulacion')">
      <span>🛣️</span>Circulación / carril
    </button>

    <button class="category" onclick="openCategory('interseccion')">
      <span>➕</span>Intersección
    </button>

    <button class="category" onclick="openCategory('glorieta')">
      <span>🔄</span>Glorieta
    </button>

    <button class="category" onclick="openCategory('velocidad')">
      <span>⏱️</span>Velocidad
    </button>

    <button class="category" onclick="openCategory('peatones')">
      <span>🚶</span>Peatones
    </button>

    <button class="category" onclick="openCategory('intermitentes')">
      <span>↔️</span>Intermitentes
    </button>

    <button class="category" onclick="openCategory('senales')">
      <span>🔴</span>Señales
    </button>

    <button class="category" onclick="openCategory('estacionamiento')">
      <span>🅿️</span>Estacionamiento
    </button>

    <button class="category" onclick="openCategory('mandos')">
      <span>⚙️</span>Mandos
    </button>
  </div>
</div>

<div class="card hidden" id="incidentCard">
  <button class="back" onclick="goBack()">← Volver</button>
  <h2 id="categoryTitle"></h2>
  <div id="incidentButtons"></div>
</div>

<div class="card">
  <div class="counters">

    <div class="counter">
      Eliminatorias
      <strong id="countE">0</strong>
    </div>

    <div class="counter">
      Deficientes
      <strong id="countD">0</strong>
    </div>

    <div class="counter">
      Leves
      <strong id="countL">0</strong>
    </div>

  </div>

  <div id="result" class="result apto">APTO</div>
</div>

<div class="card">
  <h2 style="font-size:16px">Incidencias registradas</h2>
  <div id="log">Sin incidencias registradas.</div>
</div>

<div class="card">
  <button class="finish" onclick="finishEvaluation()">
    Finalizar evaluación
  </button>
</div>

<footer>
  Evaluador DGT · Versión 0.4
</footer>

</main>

<script>

/* ==============================
   DATOS DE LA EVALUACIÓN
================================ */

const params = new URLSearchParams(window.location.search);
const student = params.get("alumno") || localStorage.getItem("alumno") || "Alumno";

document.getElementById("studentName").textContent = student;

let seconds = 0;
let E = 0;
let D = 0;
let L = 0;
let records = [];


/* ==============================
   CRONÓMETRO
================================ */

setInterval(() => {

  seconds++;

  const min = String(Math.floor(seconds / 60)).padStart(2,"0");
  const sec = String(seconds % 60).padStart(2,"0");

  document.getElementById("timer").textContent = `${min}:${sec}`;

},1000);


/* ==============================
   CATÁLOGO DE INCIDENCIAS

   En v0.4 empezamos con el
   epígrafe 7 DGT:
   INTERSECCIONES / GLORIETAS
================================ */

const catalog = {

  interseccion: {

    title:"➕ Intersección",

    groups:[

      {
        title:"7.1 · Observación",
        items:[

          {
            text:"No observa correctamente el tráfico",
            code:"7.1",
            grade:"L"
          },

          {
            text:"No observa la señalización existente",
            code:"7.1",
            grade:"L"
          }

        ]
      },

      {
        title:"7.2 · Señalización",
        items:[

          {
            text:"Omite la señal reglamentaria",
            code:"7.2",
            grade:"L"
          },

          {
            text:"Señaliza al contrario",
            code:"7.2",
            grade:"L"
          },

          {
            text:"Señaliza sin suficiente antelación",
            code:"7.2",
            grade:"L"
          },

          {
            text:"Señaliza con excesiva antelación",
            code:"7.2",
            grade:"L"
          },

          {
            text:"No mantiene la señalización",
            code:"7.2",
            grade:"L"
          },

          {
            text:"No extingue la señalización finalizada la maniobra",
            code:"7.2",
            grade:"L"
          }

        ]
      },

      {
        title:"7.3 · Posición",
        items:[

          {
            text:"Posición inadecuada en la intersección",
            code:"7.3",
            grade:"L"
          },

          {
            text:"Posición inadecuada obstaculizando",
            code:"7.3",
            grade:"D"
          },

          {
            text:"Circula por sentido contrario dejando a la derecha el centro de la glorieta, isleta o dispositivo de guía",
            code:"7.3",
            grade:"E"
          }

        ]
      },

      {
        title:"7.4 · Velocidad",
        items:[

          {
            text:"Se aproxima a velocidad inadecuada",
            code:"7.4",
            grade:"L"
          },

          {
            text:"Franquea la intersección a velocidad inadecuada",
            code:"7.4",
            grade:"L"
          },

          {
            text:"Velocidad excesivamente reducida sin causa justificada",
            code:"7.4",
            grade:"L"
          },

          {
            text:"Velocidad excesivamente reducida obstaculizando",
            code:"7.4",
            grade:"D"
          },

          {
            text:"Franquea a velocidad inadecuada generando una situación eliminatoria",
            code:"7.4",
            grade:"E"
          }

        ]
      },

      {
        title:"7.5 · Detención",
        items:[

          {
            text:"Detención súbita por falta de anticipación",
            code:"7.5",
            grade:"L"
          },

          {
            text:"Se detiene antes de alcanzar la zona de máxima visibilidad",
            code:"7.5",
            grade:"L"
          }

        ]
      }

    ]
  },


  glorieta: {

    title:"🔄 Glorieta",

    groups:[

      {
        title:"Observación",
        items:[

          {
            text:"No observa correctamente antes de entrar",
            code:"7.1",
            grade:"L"
          },

          {
            text:"No observa correctamente antes de cambiar de posición",
            code:"7.1",
            grade:"L"
          }

        ]
      },

      {
        title:"Señalización",
        items:[

          {
            text:"No señaliza cuando es obligatorio",
            code:"7.2",
            grade:"L"
          },

          {
            text:"Señaliza al contrario",
            code:"7.2",
            grade:"L"
          },

          {
            text:"No mantiene correctamente la señalización",
            code:"7.2",
            grade:"L"
          },

          {
            text:"No extingue el intermitente después de la maniobra",
            code:"7.2",
            grade:"L"
          }

        ]
      },

      {
        title:"Posición",
        items:[

          {
            text:"Posición inadecuada durante el franqueo",
            code:"7.3",
            grade:"L"
          },

          {
            text:"Posición inadecuada obstaculizando",
            code:"7.3",
            grade:"D"
          },

          {
            text:"Circula en sentido contrario alrededor de la glorieta",
            code:"7.3",
            grade:"E"
          }

        ]
      },

      {
        title:"Velocidad",
        items:[

          {
            text:"Se aproxima a velocidad inadecuada",
            code:"7.4",
            grade:"L"
          },

          {
            text:"Franquea la glorieta a velocidad inadecuada",
            code:"7.4",
            grade:"L"
          },

          {
            text:"Circula excesivamente despacio sin causa",
            code:"7.4",
            grade:"L"
          },

          {
            text:"Circula excesivamente despacio obstaculizando",
            code:"7.4",
            grade:"D"
          }

        ]
      },

      {
        title:"Detención",
        items:[

          {
            text:"Se detiene bruscamente por falta de anticipación",
            code:"7.5",
            grade:"L"
          },

          {
            text:"Se detiene sin alcanzar la zona de máxima visibilidad",
            code:"7.5",
            grade:"L"
          }

        ]
      }

    ]
  }

};


/* ==============================
   ABRIR CATEGORÍA
================================ */

function openCategory(category){

  const data = catalog[category];

  document.getElementById("categoriesCard").classList.add("hidden");
  document.getElementById("incidentCard").classList.remove("hidden");

  const title = document.getElementById("categoryTitle");
  const container = document.getElementById("incidentButtons");

  container.innerHTML = "";

  if(!data){

    title.textContent = categoryName(category);

    container.innerHTML = `
      <div class="note">
        Esta categoría se incorporará en las siguientes versiones
        utilizando los criterios oficiales DGT.
      </div>
    `;

    return;
  }

  title.textContent = data.title;

  data.groups.forEach(group => {

    const heading = document.createElement("div");
    heading.className = "section-title";
    heading.textContent = group.title;

    container.appendChild(heading);

    group.items.forEach(item => {

      const button = document.createElement("button");

      button.className = "incident";
      button.textContent = item.text;

      button.onclick = () => registerIncident(
        item.code,
        item.text,
        item.grade
      );

      container.appendChild(button);

    });

  });

}


/* ==============================
   REGISTRAR INCIDENCIA
================================ */

function registerIncident(code,text,grade){

  if(grade === "E") E++;
  if(grade === "D") D++;
  if(grade === "L") L++;

  records.push({
    time: document.getElementById("timer").textContent,
    code,
    text,
    grade
  });

  updateScreen();

}


/* ==============================
   ACTUALIZAR RESULTADO
================================ */

function updateScreen(){

  document.getElementById("countE").textContent = E;
  document.getElementById("countD").textContent = D;
  document.getElementById("countL").textContent = L;

  /*
     Baremo DGT:

     1 E
     2 D
     1 D + 5 L
     10 L
  */

  const noApto =
    E >= 1 ||
    D >= 2 ||
    (D >= 1 && L >= 5) ||
    L >= 10;

  const result = document.getElementById("result");

  result.textContent = noApto ? "NO APTO" : "APTO";
  result.className = noApto
    ? "result no-apto"
    : "result apto";


  const log = document.getElementById("log");

  if(records.length === 0){

    log.textContent = "Sin incidencias registradas.";
    return;

  }

  log.innerHTML = "";

  records.forEach((record,index) => {

    const row = document.createElement("div");
    row.className = "log-item";

    row.innerHTML = `
      <span class="badge ${record.grade}">
        ${record.grade}
      </span>

      <span class="code">
        ${record.code}
      </span>

      · ${record.text}

      <br>

      <small>
        ⏱ ${record.time}
      </small>
    `;

    log.appendChild(row);

  });

}


/* ==============================
   VOLVER
================================ */

function goBack(){

  document.getElementById("incidentCard").classList.add("hidden");
  document.getElementById("categoriesCard").classList.remove("hidden");

}


/* ==============================
   NOMBRES DE CATEGORÍAS
================================ */

function categoryName(category){

  const names = {
    incorporacion:"🚘 Incorporación",
    circulacion:"🛣️ Circulación / carril",
    interseccion:"➕ Intersección",
    glorieta:"🔄 Glorieta",
    velocidad:"⏱️ Velocidad",
    peatones:"🚶 Peatones",
    intermitentes:"↔️ Intermitentes",
    senales:"🔴 Señales",
    estacionamiento:"🅿️ Estacionamiento",
    mandos:"⚙️ Mandos"
  };

  return names[category] || category;

}


/* ==============================
   FINALIZAR
================================ */

function finishEvaluation(){

  const noApto =
    E >= 1 ||
    D >= 2 ||
    (D >= 1 && L >= 5) ||
    L >= 10;

  let summary = `Alumno: ${student}\n`;
  summary += `Tiempo: ${document.getElementById("timer").textContent}\n\n`;

  summary += `Eliminatorias: ${E}\n`;
  summary += `Deficientes: ${D}\n`;
  summary += `Leves: ${L}\n\n`;

  summary += `RESULTADO: ${noApto ? "NO APTO" : "APTO"}`;

  if(records.length){

    summary += "\n\nINCIDENCIAS:\n";

    records.forEach(record => {

      summary +=
        `\n${record.grade} · ${record.code} · ${record.text}`;

    });

  }

  alert(summary);

}

</script>

</body>
</html>
