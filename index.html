<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evaluador DGT</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

header {
  background: #17324d;
  color: white;
  padding: 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 28px;
}

header p {
  margin: 6px 0 0;
}

.container {
  max-width: 720px;
  margin: 20px auto;
  padding: 0 14px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 5px 18px rgba(0,0,0,.08);
}

h2, h3 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 17px;
}

button {
  border: 0;
  border-radius: 11px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #17324d;
  color: white;
  margin-top: 14px;
}

.hidden {
  display: none;
}

/* CABECERA EVALUACIÓN */

.student {
  font-size: 14px;
}

.student-name {
  font-size: 21px;
  font-weight: 700;
}

.timer {
  text-align: center;
  font-size: 34px;
  font-weight: 800;
  margin-top: 12px;
}

/* CATEGORÍAS */

.categories {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.category {
  min-height: 72px;
  background: #17324d;
  color: white;
}

.category span {
  display: block;
  font-size: 22px;
  margin-bottom: 4px;
}

/* INCIDENCIAS */

.back {
  background: #e5e7eb;
  color: #1f2937;
  margin-bottom: 14px;
}

.incident-option {
  width: 100%;
  text-align: left;
  background: #f3f4f6;
  color: #111827;
  margin-bottom: 9px;
  line-height: 1.25;
}

.incident-option:hover {
  background: #e5e7eb;
}

/* CONTADORES */

.counters {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
  margin-top: 16px;
}

.counter {
  text-align: center;
  background: #f3f4f6;
  padding: 10px;
  border-radius: 10px;
}

.counter strong {
  display: block;
  font-size: 24px;
}

.status {
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-size: 18px;
  font-weight: 800;
}

.apto {
  background: #d1fae5;
  color: #166534;
}

.no-apto {
  background: #fee2e2;
  color: #991b1b;
}

/* HISTORIAL */

.history-item {
  border-left: 5px solid #9ca3af;
  background: #f9fafb;
  padding: 10px 12px;
  margin-bottom: 9px;
  border-radius: 8px;
}

.history-item.E {
  border-color: #dc2626;
}

.history-item.D {
  border-color: #ea8a00;
}

.history-item.L {
  border-color: #2563eb;
}

.code {
  font-weight: 800;
}

.badge {
  float: right;
  font-weight: 800;
}

footer {
  text-align: center;
  color: #6b7280;
  padding: 8px 0 30px;
  font-size: 13px;
}

@media(max-width:520px) {
  .categories {
    grid-template-columns: 1fr 1fr;
  }

  .category {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🚗 Evaluador DGT</h1>
  <p>Evaluación de clases prácticas de conducción</p>
</header>

<div class="container">

  <!-- INICIO -->

  <section id="startScreen">

    <div class="card">
      <h2>Nueva evaluación</h2>

      <label><strong>Alumno</strong></label>

      <input
        id="studentInput"
        type="text"
        placeholder="Nombre del alumno"
      >

      <button class="primary" onclick="startEvaluation()">
        Iniciar evaluación
      </button>
    </div>

  </section>


  <!-- EVALUACIÓN -->

  <section id="evaluationScreen" class="hidden">

    <div class="card">

      <div class="student">Alumno</div>
      <div id="studentName" class="student-name"></div>

      <div id="timer" class="timer">00:00</div>

    </div>


    <!-- CATEGORÍAS -->

    <div id="categoryCard" class="card">

      <h2>¿Qué ha ocurrido?</h2>

      <div class="categories">

        <button class="category" onclick="openCategory('incorporacion')">
          <span>🚘</span>
          Incorporación
        </button>

        <button class="category" onclick="openCategory('progresion')">
          <span>🛣️</span>
          Circulación / carril
        </button>

        <button class="category" onclick="openCategory('interseccion')">
          <span>➕</span>
          Intersección
        </button>

        <button class="category" onclick="openCategory('glorieta')">
          <span>🔄</span>
          Glorieta
        </button>

        <button class="category" onclick="openCategory('velocidad')">
          <span>⏱️</span>
          Velocidad
        </button>

        <button class="category" onclick="openCategory('peatones')">
          <span>🚶</span>
          Peatones
        </button>

        <button class="category" onclick="openCategory('senalizacion')">
          <span>↔️</span>
          Intermitentes
        </button>

        <button class="category" onclick="openCategory('senales')">
          <span>🛑</span>
          Señales
        </button>

        <button class="category" onclick="openCategory('estacionamiento')">
          <span>🅿️</span>
          Estacionamiento
        </button>

        <button class="category" onclick="openCategory('mandos')">
          <span>⚙️</span>
          Mandos
        </button>

      </div>

    </div>


    <!-- LISTA INCIDENCIAS -->

    <div id="incidentCard" class="card hidden">

      <button class="back" onclick="backCategories()">
        ← Volver
      </button>

      <h2 id="categoryTitle"></h2>

      <div id="incidentOptions"></div>

    </div>


    <!-- RESULTADO -->

    <div class="card">

      <div class="counters">

        <div class="counter">
          Eliminatorias
          <strong id="countE">0</strong>
        </div>

        <div class="counter">
          Deficientes
          <strong id="countD">0</strong>
        </div>

        <div class="counter">
          Leves
          <strong id="countL">0</strong>
        </div>

      </div>

      <div id="status" class="status apto">
        APTO
      </div>

    </div>


    <!-- HISTORIAL -->

    <div class="card">

      <h3>Incidencias registradas</h3>

      <div id="history">
        Sin incidencias registradas.
      </div>

    </div>


    <div class="card">

      <button class="primary" onclick="finishEvaluation()">
        Finalizar evaluación
      </button>

    </div>

  </section>

</div>

<footer>
  Evaluador DGT · Versión 0.3
</footer>


<script>

/*
  BASE DE INCIDENCIAS v0.3

  E = Eliminatoria
  D = Deficiente
  L = Leve

  Esta versión inicia la estructura Situación → Incidencia →
  código → calificación.

  El catálogo se ampliará progresivamente con todos los
  criterios oficiales.
*/

const incidents = {

  incorporacion: {
    title: "🚘 Incorporación a la circulación",
    items: [

      {
        text: "No observar el tráfico delante, detrás y/o lateralmente",
        code: "3.1",
        type: "L"
      },

      {
        text: "Omitir la señal reglamentaria",
        code: "3.2",
        type: "L"
      },

      {
        text: "Señalizar al contrario",
        code: "3.2",
        type: "L"
      },

      {
        text: "Señalizar sin suficiente antelación",
        code: "3.2",
        type: "L"
      },

      {
        text: "No extinguir el intermitente al finalizar",
        code: "3.2",
        type: "L"
      },

      {
        text: "Realizar la incorporación obstaculizando",
        code: "3.3",
        type: "D"
      },

      {
        text: "Realizar la incorporación de forma no gradual",
        code: "3.3",
        type: "L"
      },

      {
        text: "Utilización inadecuada del carril de aceleración",
        code: "3.3",
        type: "L"
      },

      {
        text: "Utilización inadecuada del carril de aceleración obstaculizando",
        code: "3.3",
        type: "D"
      }

    ]
  },


  progresion: {
    title: "🛣️ Circulación / carril",
    items: [

      {
        text: "No circular por el carril derecho cuando sea reglamentario",
        code: "4.1",
        type: "L"
      },

      {
        text: "No circular por el carril derecho, obstaculizando",
        code: "4.1",
        type: "D"
      },

      {
        text: "Circular por el arcén parcial o totalmente",
        code: "4.1",
        type: "L"
      }

    ]
  },


  senalizacion: {
    title: "↔️ Señalización / intermitentes",
    items: [

      {
        text: "Omitir el intermitente",
        code: "3.2",
        type: "L"
      },

      {
        text: "Señalizar al contrario",
        code: "3.2",
        type: "L"
      },

      {
        text: "Señalizar tarde",
        code: "3.2",
        type: "L"
      },

      {
        text: "Mantener el intermitente después de finalizar la maniobra",
        code: "3.2",
        type: "L"
      }

    ]
  },


  senales: {
    title: "🛑 Obediencia de las señales",
    items: [

      {
        text: "No respetar las señales de los agentes",
        code: "11.1",
        type: "E"
      },

      {
        text: "Demorar la marcha cuando el agente permite pasar",
        code: "11.1",
        type: "L"
      },

      {
        text: "Demorar la marcha cuando el agente permite pasar, obstaculizando",
        code: "11.1",
        type: "D"
      }

    ]
  },


  estacionamiento: {
    title: "🅿️ Estacionamiento",
    items: [

      {
        text: "No utilizar adecuadamente el espacio disponible",
        code: "10",
        type: "L"
      },

      {
        text: "No utilizar adecuadamente el espacio disponible, obstaculizando",
        code: "10",
        type: "D"
      },

      {
        text: "Golpear fuertemente el bordillo sin subirlo",
        code: "10",
        type: "L"
      },

      {
        text: "Dejar el vehículo sensiblemente oblicuo",
        code: "10",
        type: "L"
      },

      {
        text: "No accionar el freno de estacionamiento",
        code: "10",
        type: "L"
      }

    ]
  },


  interseccion: {
    title: "➕ Intersección",
    items: [
      {
        text: "Catálogo pendiente de incorporar desde los criterios DGT",
        disabled: true
      }
    ]
  },


  glorieta: {
    title: "🔄 Glorieta",
    items: [
      {
        text: "Catálogo pendiente de incorporar desde los criterios DGT",
        disabled: true
      }
    ]
  },


  velocidad: {
    title: "⏱️ Velocidad",
    items: [
      {
        text: "Catálogo pendiente de incorporar desde los criterios DGT",
        disabled: true
      }
    ]
  },


  peatones: {
    title: "🚶 Peatones",
    items: [
      {
        text: "Catálogo pendiente de incorporar desde los criterios DGT",
        disabled: true
      }
    ]
  },


  mandos: {
    title: "⚙️ Mandos del vehículo",
    items: [
      {
        text: "Catálogo pendiente de incorporar desde los criterios DGT",
        disabled: true
      }
    ]
  }

};


let evaluation = [];
let seconds = 0;
let timerInterval;


/* INICIAR */

function startEvaluation() {

  const name =
    document.getElementById("studentInput").value.trim();

  if (!name) {
    alert("Introduce el nombre del alumno.");
    return;
  }

  document.getElementById("studentName").textContent = name;

  document.getElementById("startScreen")
    .classList.add("hidden");

  document.getElementById("evaluationScreen")
    .classList.remove("hidden");

  seconds = 0;

  timerInterval = setInterval(() => {

    seconds++;

    const min =
      String(Math.floor(seconds / 60)).padStart(2,"0");

    const sec =
      String(seconds % 60).padStart(2,"0");

    document.getElementById("timer").textContent =
      `${min}:${sec}`;

  },1000);
}


/* ABRIR CATEGORÍA */

function openCategory(category) {

  const data = incidents[category];

  document.getElementById("categoryCard")
    .classList.add("hidden");

  document.getElementById("incidentCard")
    .classList.remove("hidden");

  document.getElementById("categoryTitle")
    .textContent = data.title;

  const container =
    document.getElementById("incidentOptions");

  container.innerHTML = "";

  data.items.forEach(item => {

    const button = document.createElement("button");

    button.className = "incident-option";

    button.textContent = item.text;

    if (item.disabled) {

      button.disabled = true;
      button.style.opacity = ".5";

    } else {

      button.onclick = () =>
        registerIncident(item, data.title);

    }

    container.appendChild(button);

  });
}


/* VOLVER */

function backCategories() {

  document.getElementById("incidentCard")
    .classList.add("hidden");

  document.getElementById("categoryCard")
    .classList.remove("hidden");
}


/* REGISTRAR */

function registerIncident(item, category) {

  evaluation.push({

    ...item,

    category: category,

    time: document.getElementById("timer").textContent

  });

  updateEvaluation();

  /* vuelve automáticamente a las categorías */

  backCategories();
}


/* ACTUALIZAR */

function updateEvaluation() {

  const E =
    evaluation.filter(x => x.type === "E").length;

  const D =
    evaluation.filter(x => x.type === "D").length;

  const L =
    evaluation.filter(x => x.type === "L").length;


  document.getElementById("countE").textContent = E;
  document.getElementById("countD").textContent = D;
  document.getElementById("countL").textContent = L;


  /*
    BAREMO DGT:

    1 E
    2 D
    1 D + 5 L
    10 L
  */

  const noApto =
    E >= 1 ||
    D >= 2 ||
    (D >= 1 && L >= 5) ||
    L >= 10;


  const status =
    document.getElementById("status");

  if (noApto) {

    status.textContent = "NO APTO";
    status.className = "status no-apto";

  } else {

    status.textContent = "APTO";
    status.className = "status apto";

  }


  updateHistory();
}


/* HISTORIAL */

function updateHistory() {

  const history =
    document.getElementById("history");

  if (evaluation.length === 0) {

    history.innerHTML =
      "Sin incidencias registradas.";

    return;
  }

  history.innerHTML = "";

  evaluation
    .slice()
    .reverse()
    .forEach(item => {

      const div =
        document.createElement("div");

      div.className =
        `history-item ${item.type}`;

      div.innerHTML = `

        <span class="badge">
          ${item.type}
        </span>

        <span class="code">
          ${item.code}
        </span>

        · ${item.text}

        <br>

        <small>
          ${item.time}
        </small>

      `;

      history.appendChild(div);

    });

}


/* FINALIZAR */

function finishEvaluation() {

  clearInterval(timerInterval);

  const E =
    evaluation.filter(x => x.type === "E").length;

  const D =
    evaluation.filter(x => x.type === "D").length;

  const L =
    evaluation.filter(x => x.type === "L").length;

  const noApto =
    E >= 1 ||
    D >= 2 ||
    (D >= 1 && L >= 5) ||
    L >= 10;

  const result =
    noApto ? "NO APTO" : "APTO";

  alert(
    "Evaluación finalizada\n\n" +
    "Resultado: " + result + "\n" +
    "Eliminatorias: " + E + "\n" +
    "Deficientes: " + D + "\n" +
    "Leves: " + L
  );

}

</script>

</body>
</html>
